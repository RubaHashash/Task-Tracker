<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <title>Task Board</title>

      <style>
        :root {
            --bg: #f2f3f8;
            --panel: #ffffff;
            --panel-muted: #f6f7fb;
            --text: #161922;
            --text-muted: #667085;
            --line: #e4e7ec;
            --todo-accent: #6366f1;
            --inprogress-accent: #d97706;
            --done-accent: #059669;
            --avatar-bg: rgba(99, 102, 241, 0.14);
            --priority-high: #dc2626;
            --priority-high-bg: #fef2f2;
            --priority-medium: #b45309;
            --priority-medium-bg: #fffbeb;
            --priority-low: #047857;
            --priority-low-bg: #ecfdf5;
            --error-bg: #fef2f2;
            --error-line: #fecaca;
            --error-text: #b91c1c;
            --radius: 18px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
            --shadow-md: 0 4px 16px rgba(16, 24, 40, 0.08), 0 1px 3px rgba(16, 24, 40, 0.06);
            --shadow-lg: 0 24px 48px -12px rgba(16, 24, 40, 0.35);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0d12;
                --panel: #171a21;
                --panel-muted: #1d212b;
                --text: #eceef1;
                --text-muted: #9aa3af;
                --line: #2b303b;
                --avatar-bg: rgba(129, 140, 248, 0.18);
                --priority-high: #f87171;
                --priority-high-bg: rgba(239, 68, 68, 0.15);
                --priority-medium: #fbbf24;
                --priority-medium-bg: rgba(217, 119, 6, 0.16);
                --priority-low: #34d399;
                --priority-low-bg: rgba(5, 150, 105, 0.16);
                --error-bg: rgba(239, 68, 68, 0.12);
                --error-line: rgba(239, 68, 68, 0.35);
                --error-text: #f87171;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
                --shadow-md: 0 4px 18px rgba(0, 0, 0, 0.45);
                --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.65);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at 10% -10%, rgba(99, 102, 241, 0.10), transparent 40%),
                radial-gradient(circle at 90% 0%, rgba(5, 150, 105, 0.08), transparent 35%),
                var(--bg);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem 2.5rem;
            display: flex;
            justify-content: center;
        }

        .page-inner {
            width: 100%;
            max-width: 1100px;
        }

        .board-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 1.4rem 1.85rem;
        }

        .app-header {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            text-align: left;
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        .new-task-btn {
            border: none;
            background: linear-gradient(135deg, var(--todo-accent), #818cf8);
            color: #ffffff;
            border-radius: var(--radius-sm);
            padding: 0.55rem 1.05rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .new-task-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.03);
        }

        .new-task-btn:active {
            transform: translateY(0);
        }

        .app-header h1 {
            margin: 0;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .app-header h1 a {
            color: inherit;
            text-decoration: none;
            background: linear-gradient(135deg, var(--text), var(--todo-accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .app-header h1 a:hover,
        .app-header h1 a:focus-visible {
            text-decoration: underline;
        }

        .app-header p {
            margin: 0.4rem 0 0;
            color: var(--text-muted);
            max-width: 56ch;
        }

        .board-message {
            margin-bottom: 0.85rem;
            padding: 0.75rem 0.95rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--line);
            background: var(--panel-muted);
            color: var(--text);
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .board-message.is-error {
            background: var(--error-bg);
            border-color: var(--error-line);
            color: var(--error-text);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(220px, 1fr));
            gap: 1.1rem;
            align-items: start;
        }

        .column {
            background: var(--panel-muted);
            border: 1px solid var(--line);
            border-top: 3px solid transparent;
            border-radius: var(--radius);
            padding: 0.9rem;
            min-height: 340px;
            transition: outline-color 0.12s ease, background-color 0.12s ease;
        }

        .column[data-status="ToDo"] {
            border-top-color: var(--todo-accent);
        }

        .column[data-status="InProgress"] {
            border-top-color: var(--inprogress-accent);
        }

        .column[data-status="Done"] {
            border-top-color: var(--done-accent);
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.85rem;
        }

        .column-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .column-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.7rem;
            height: 1.7rem;
            padding: 0 0.4rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            color: #fff;
        }

        .column[data-status="ToDo"] .column-count {
            background: var(--todo-accent);
        }

        .column[data-status="InProgress"] .column-count {
            background: var(--inprogress-accent);
        }

        .column[data-status="Done"] .column-count {
            background: var(--done-accent);
        }

        .card-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 0.8rem;
            min-height: 180px;
        }

        .card-list:empty::before {
            content: "No tasks in this column yet.";
            display: block;
            border: 1px dashed var(--line);
            background: var(--panel);
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            padding: 0.85rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .task-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 0.95rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .task-card.is-error {
            background: var(--error-bg);
            border-color: var(--error-line);
            color: var(--error-text);
        }

        .task-card[draggable="true"] {
            cursor: grab;
        }

        .task-card.is-dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .column.drag-over {
            outline: 2px dashed var(--todo-accent);
            outline-offset: -4px;
        }

        .column.drag-forbidden {
            outline: 2px dashed var(--error-line);
            outline-offset: -4px;
            background: var(--error-bg);
        }

        .task-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.6rem;
            margin-bottom: 0.3rem;
        }

        .task-card-top .task-title {
            margin: 0;
        }

        .task-title {
            margin: 0 0 0.35rem;
            font-size: 1rem;
            font-weight: 700;
        }

        .task-description {
            margin: 0 0 0.65rem;
            color: var(--text-muted);
            font-size: 0.94rem;
            line-height: 1.35;
        }

        .task-status-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.75rem;
            font-size: 0.83rem;
        }

        .priority-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.22rem 0.6rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.01em;
        }

        .priority-badge[data-priority="High"] {
            background: var(--priority-high-bg);
            color: var(--priority-high);
        }

        .priority-badge[data-priority="Medium"] {
            background: var(--priority-medium-bg);
            color: var(--priority-medium);
        }

        .priority-badge[data-priority="Low"] {
            background: var(--priority-low-bg);
            color: var(--priority-low);
        }

        .assignee-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .assignee-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 999px;
            background: var(--avatar-bg);
            color: var(--todo-accent);
            font-size: 0.72rem;
            font-weight: 800;
        }

        .due-date-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .due-date-chip svg {
            flex-shrink: 0;
        }

        .overdue-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.22rem 0.6rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.01em;
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-line);
        }

        .filter-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.1rem;
            padding: 0.9rem 1.1rem;
        }

        .filter-toolbar input,
        .filter-toolbar select {
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 0.45rem 0.65rem;
            font: inherit;
            font-size: 0.88rem;
            color: var(--text);
            background: var(--panel);
        }

        .filter-search {
            flex: 1 1 220px;
            min-width: 160px;
        }

        .filter-assignee {
            flex: 0 1 160px;
        }

        .task-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .edit-btn {
            border: 1px solid var(--line);
            background: var(--panel-muted);
            color: var(--text);
            border-radius: var(--radius-sm);
            padding: 0.35rem 0.75rem;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .edit-btn:hover {
            background: var(--panel);
            border-color: var(--todo-accent);
        }

        .card-list.is-loading .task-card {
            position: relative;
            min-height: 122px;
            overflow: hidden;
            background: var(--panel-muted);
            border-color: var(--line);
            box-shadow: none;
        }

        .card-list.is-loading .task-card > * {
            opacity: 0;
        }

        .card-list.is-loading .task-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 10%,
                rgba(127, 137, 156, 0.18) 45%,
                transparent 80%
            );
            transform: translateX(-100%);
            animation: loading-sheen 1.2s infinite;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(10, 12, 18, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.18s ease, visibility 0.18s ease;
        }

        .modal.is-open {
            opacity: 1;
            visibility: visible;
        }

        .modal-dialog {
            width: min(540px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 1.1rem;
            transform: translateY(10px) scale(0.98);
            transition: transform 0.18s ease;
        }

        .modal.is-open .modal-dialog {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.7rem;
        }

        .modal-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .modal-close {
            border: 1px solid var(--line);
            background: var(--panel-muted);
            color: var(--text);
            border-radius: var(--radius-sm);
            width: 2.1rem;
            height: 2.1rem;
            font-size: 1rem;
            cursor: pointer;
            line-height: 1;
            transition: background-color 0.15s ease;
        }

        .modal-close:hover {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .task-form {
            display: grid;
            gap: 0.8rem;
        }

        .form-row {
            display: grid;
            gap: 0.3rem;
        }

        .form-row label {
            font-size: 0.88rem;
            font-weight: 700;
        }

        .task-form input,
        .task-form select,
        .task-form textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 0.55rem 0.65rem;
            font: inherit;
            color: var(--text);
            background: var(--panel);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .task-form input:focus,
        .task-form select:focus,
        .task-form textarea:focus {
            outline: none;
            border-color: var(--todo-accent);
            box-shadow: 0 0 0 3px var(--avatar-bg);
        }

        .task-form textarea {
            min-height: 92px;
            resize: vertical;
        }

        .form-error {
            margin: 0;
            font-size: 0.83rem;
            color: var(--error-text);
            min-height: 1.1rem;
        }

        .form-banner {
            display: none;
            border: 1px solid var(--error-line);
            background: var(--error-bg);
            color: var(--error-text);
            border-radius: var(--radius-sm);
            padding: 0.55rem 0.65rem;
            font-size: 0.87rem;
        }

        .form-banner.is-visible {
            display: block;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.55rem;
            margin-top: 0.2rem;
        }

        .btn-secondary {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            border-radius: var(--radius-sm);
            padding: 0.45rem 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.15s ease;
        }

        .btn-secondary:hover {
            background: var(--panel-muted);
        }

        .btn-primary {
            border: none;
            background: linear-gradient(135deg, var(--todo-accent), #818cf8);
            color: #fff;
            border-radius: var(--radius-sm);
            padding: 0.45rem 0.85rem;
            cursor: pointer;
            font-weight: 700;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes loading-sheen {
            to {
                transform: translateX(100%);
            }
        }

        @media (max-width: 900px) {
            .board {
                grid-template-columns: 1fr;
            }

            .column {
                min-height: 0;
            }

            .app-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
    </head>
    <body>
        <div class="page">
            <div class="page-inner">
                <header class="app-header board-card">
                    <div class="header-text">
                        <h1><a href="/">Task Board</a></h1>
                        <p>Drag tasks column to update their status</p>
                    </div>
                    <div class="header-actions">
                        <button id="new-task-btn" type="button" class="new-task-btn">New Task</button>
                    </div>
                </header>

                <div class="filter-toolbar board-card">
                    <input id="filter-search" type="text" class="filter-search" placeholder="Search title or description">
                    <select id="filter-priority">
                        <option value="">All priorities</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <input id="filter-assignee" type="text" class="filter-assignee" placeholder="Assignee">
                    <select id="overdue-filter">
                        <option value="">All tasks</option>
                        <option value="true">Overdue</option>
                        <option value="false">Not overdue</option>
                    </select>
                    <button id="clear-filters-btn" type="button" class="btn-secondary">Clear Filters</button>
                </div>

                <main>
                    <section id="board" class="board" aria-live="polite"></section>
                </main>
            </div>
        </div>

        <div id="task-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h2 id="task-modal-title" class="modal-title">New Task</h2>
                    <button id="task-modal-close" type="button" class="modal-close" aria-label="Close modal">x</button>
                </div>

                <form id="task-form" class="task-form" novalidate>
                    <input id="task-id" name="taskId" type="hidden" value="">

                    <p id="form-error-banner" class="form-banner" role="alert"></p>

                    <div class="form-row">
                        <label for="task-title">Title</label>
                        <input id="task-title" name="title" type="text" maxlength="200">
                        <p id="task-title-error" class="form-error" role="alert"></p>
                    </div>

                    <div class="form-row">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" name="description"></textarea>
                        <p id="task-description-error" class="form-error" role="alert"></p>
                    </div>

                    <div class="form-row">
                        <label for="task-due-date">Due date</label>
                        <input id="task-due-date" name="dueDate" type="date">
                        <p id="task-due-date-error" class="form-error" role="alert"></p>
                    </div>

                    <div class="form-row">
                        <label for="task-status">Status</label>
                        <select id="task-status" name="status">
                            <option value="ToDo">To Do</option>
                            <option value="InProgress">In Progress</option>
                            <option value="Done">Done</option>
                        </select>
                        <p id="task-status-error" class="form-error" role="alert"></p>
                    </div>

                    <div class="form-row">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority" name="priority">
                            <option value="High">High</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Low">Low</option>
                        </select>
                        <p id="task-priority-error" class="form-error" role="alert"></p>
                    </div>

                    <div class="form-row">
                        <label for="task-assignee">Assignee</label>
                        <input id="task-assignee" name="assignee" type="text" maxlength="120">
                        <p id="task-assignee-error" class="form-error" role="alert"></p>
                    </div>

                    <div class="modal-actions">
                        <button id="task-modal-cancel" type="button" class="btn-secondary">Cancel</button>
                        <button id="task-modal-submit" type="submit" class="btn-primary">Create Task</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            const API_BASE = "http://localhost:8000";
            const STATUS = ["ToDo", "InProgress", "Done"];
            const STATUS_LABELS = {
                "ToDo": "To Do",
                "InProgress": "In Progress",
                "Done": "Done"
            };
            const PRIORITY_ORDER = {
                "High": 0,
                "Medium": 1,
                "Low": 2
            };
            const ALLOWED_TRANSITIONS = {
                "ToDo": ["ToDo", "InProgress"],
                "InProgress": ["ToDo", "InProgress", "Done"],
                "Done": ["Done", "InProgress"]
            };

            function isValidTransition(fromStatus, toStatus) {
                return ALLOWED_TRANSITIONS[fromStatus]?.includes(toStatus) ?? false;
            }

            function todayIsoDate() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, "0");
                const day = String(now.getDate()).padStart(2, "0");
                return `${year}-${month}-${day}`;
            }

            function isTaskOverdue(task) {
                return Boolean(task.due_date) && task.due_date < todayIsoDate() && task.status !== "Done";
            }

            function formatDueDate(dueDate) {
                const [year, month, day] = dueDate.split("-");
                return `${month}/${day}/${year}`;
            }

            let tasks = [];
            let draggingStatus = null;
            let boardState = "loading";
            let modalMode = "create";
            let modalSubmitLocked = false;
            let overdueFilter = "";
            let searchFilter = "";
            let priorityFilter = "";
            let assigneeFilter = "";
            let searchDebounceTimer = null;
            let editingTaskStatus = null;

            function getBoardMessageElement() {
                let message = document.getElementById("board-message");
                if (message) {
                    return message;
                }

                message = document.createElement("div");
                message.id = "board-message";
                message.className = "board-message";
                message.setAttribute("aria-live", "polite");
                message.style.display = "none";

                const board = document.getElementById("board");
                board.parentElement.insertBefore(message, board);
                return message;
            }

            function clearBoardMessage() {
                const message = getBoardMessageElement();
                message.style.display = "none";
                message.classList.remove("is-error");
                message.replaceChildren();
            }

            function getModalRefs() {
                return {
                    modal: document.getElementById("task-modal"),
                    form: document.getElementById("task-form"),
                    title: document.getElementById("task-modal-title"),
                    submit: document.getElementById("task-modal-submit"),
                    close: document.getElementById("task-modal-close"),
                    cancel: document.getElementById("task-modal-cancel"),
                    banner: document.getElementById("form-error-banner"),
                    fieldId: document.getElementById("task-id"),
                    fieldTitle: document.getElementById("task-title"),
                    fieldDescription: document.getElementById("task-description"),
                    fieldDueDate: document.getElementById("task-due-date"),
                    fieldStatus: document.getElementById("task-status"),
                    fieldPriority: document.getElementById("task-priority"),
                    fieldAssignee: document.getElementById("task-assignee"),
                    errTitle: document.getElementById("task-title-error"),
                    errDescription: document.getElementById("task-description-error"),
                    errDueDate: document.getElementById("task-due-date-error"),
                    errStatus: document.getElementById("task-status-error"),
                    errPriority: document.getElementById("task-priority-error"),
                    errAssignee: document.getElementById("task-assignee-error")
                };
            }

            function clearModalErrors() {
                const refs = getModalRefs();
                refs.banner.textContent = "";
                refs.banner.classList.remove("is-visible");
                refs.errTitle.textContent = "";
                refs.errDescription.textContent = "";
                refs.errDueDate.textContent = "";
                refs.errStatus.textContent = "";
                refs.errPriority.textContent = "";
                refs.errAssignee.textContent = "";
            }

            function showModalBanner(message) {
                const refs = getModalRefs();
                refs.banner.textContent = message;
                refs.banner.classList.add("is-visible");
            }

            function mapServerErrorsToModal(data) {
                const refs = getModalRefs();
                const detail = data && data.detail;
                if (!Array.isArray(detail)) {
                    return false;
                }

                let matched = false;
                detail.forEach((item) => {
                    if (!item || !Array.isArray(item.loc) || typeof item.msg !== "string") {
                        return;
                    }

                    const field = item.loc[item.loc.length - 1];
                    if (field === "title") {
                        refs.errTitle.textContent = item.msg;
                        matched = true;
                    } else if (field === "description") {
                        refs.errDescription.textContent = item.msg;
                        matched = true;
                    } else if (field === "due_date") {
                        refs.errDueDate.textContent = item.msg;
                        matched = true;
                    } else if (field === "status") {
                        refs.errStatus.textContent = item.msg;
                        matched = true;
                    } else if (field === "priority") {
                        refs.errPriority.textContent = item.msg;
                        matched = true;
                    } else if (field === "assignee") {
                        refs.errAssignee.textContent = item.msg;
                        matched = true;
                    }
                });

                return matched;
            }

            function resetTaskForm() {
                const refs = getModalRefs();
                refs.form.reset();
                refs.fieldId.value = "";
                refs.fieldStatus.value = "ToDo";
                refs.fieldPriority.value = "Medium";
                refs.fieldDescription.value = "";
                refs.fieldDueDate.value = "";
                refs.fieldAssignee.value = "";
                refs.submit.disabled = false;
                clearModalErrors();
            }

            function openTaskModal(mode, task = null) {
                const refs = getModalRefs();
                modalMode = mode;
                modalSubmitLocked = false;

                resetTaskForm();

                if (mode === "edit" && task) {
                    refs.title.textContent = "Edit Task";
                    refs.submit.textContent = "Save Changes";
                    refs.fieldId.value = task.id ?? "";
                    refs.fieldTitle.value = task.title ?? "";
                    refs.fieldDescription.value = task.description ?? "";
                    refs.fieldDueDate.value = task.due_date ?? "";
                    refs.fieldStatus.value = task.status ?? "ToDo";
                    refs.fieldPriority.value = task.priority ?? "Medium";
                    refs.fieldAssignee.value = task.assignee ?? "";
                    editingTaskStatus = task.status ?? "ToDo";
                } else {
                    refs.title.textContent = "New Task";
                    refs.submit.textContent = "Create Task";
                    editingTaskStatus = null;
                }

                refs.modal.classList.add("is-open");
                refs.fieldTitle.focus();
            }

            function closeTaskModal() {
                const refs = getModalRefs();
                refs.modal.classList.remove("is-open");
                modalSubmitLocked = false;
                resetTaskForm();
            }

            function showBoardMessage(text, options = {}) {
                const message = getBoardMessageElement();
                const content = document.createElement("span");
                content.textContent = text;

                message.replaceChildren(content);
                message.style.display = "flex";
                message.classList.toggle("is-error", Boolean(options.isError));

                if (options.showRetry) {
                    const retryBtn = document.createElement("button");
                    retryBtn.type = "button";
                    retryBtn.className = "btn-secondary";
                    retryBtn.style.marginLeft = "auto";
                    retryBtn.textContent = "Retry";
                    retryBtn.addEventListener("click", () => {
                        fetchTasks();
                    });
                    message.appendChild(retryBtn);
                }
            }

            function escapeHtml(value) {
                const text = String(value ?? "");
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function sortTasksForColumn(columnTasks) {
                return [...columnTasks].sort((a, b) => {
                    const priorityA = PRIORITY_ORDER[a.priority] ?? Number.MAX_SAFE_INTEGER;
                    const priorityB = PRIORITY_ORDER[b.priority] ?? Number.MAX_SAFE_INTEGER;

                    if (priorityA !== priorityB) {
                        return priorityA - priorityB;
                    }

                    const idA = Number(a.id);
                    const idB = Number(b.id);
                    const hasNumericA = Number.isFinite(idA);
                    const hasNumericB = Number.isFinite(idB);

                    if (hasNumericA && hasNumericB) {
                        return idA - idB;
                    }

                    return String(a.id ?? "").localeCompare(String(b.id ?? ""));
                });
            }

            const DUE_DATE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';

            function renderTaskCard(task) {
                const safeTitle = escapeHtml(task.title || "Untitled task");
                const safeDescription = escapeHtml(task.description || "");
                const priority = task.priority || "Low";
                const safePriority = escapeHtml(priority);
                const safeAssignee = escapeHtml(task.assignee || "Unassigned");
                const safeTaskId = escapeHtml(task.id ?? "");
                const assigneeInitial = escapeHtml((task.assignee || "?").trim().charAt(0).toUpperCase() || "?");
                const descriptionHtml = safeDescription
                    ? `<p class="task-description">${safeDescription}</p>`
                    : "";
                const dueDateHtml = task.due_date
                    ? `<span class="due-date-chip">${DUE_DATE_ICON}${escapeHtml(formatDueDate(task.due_date))}</span>`
                    : "";
                const overduePillHtml = isTaskOverdue(task)
                    ? `<span class="overdue-pill">Overdue</span>`
                    : "";
                const statusRowHtml = (overduePillHtml || dueDateHtml)
                    ? `<div class="task-status-row">${overduePillHtml}${dueDateHtml}</div>`
                    : "";

                return `
                    <li class="task-card" data-task-id="${safeTaskId}" draggable="true">
                        <div class="task-card-top">
                            <h3 class="task-title">${safeTitle}</h3>
                            <span class="priority-badge" data-priority="${safePriority}">${safePriority}</span>
                        </div>
                        ${descriptionHtml}
                        ${statusRowHtml}
                        <div class="task-actions">
                            <span class="assignee-chip"><span class="assignee-avatar">${assigneeInitial}</span>${safeAssignee}</span>
                            <button type="button" class="edit-btn">Edit</button>
                        </div>
                    </li>
                `;
            }

            function renderColumn(status, columnTasks) {
                const sorted = sortTasksForColumn(columnTasks);
                const cardsHtml = sorted.map(renderTaskCard).join("");

                return `
                    <article class="column" data-status="${status}">
                        <div class="column-header">
                            <h2 class="column-title">${STATUS_LABELS[status]}</h2>
                            <span class="column-count" aria-label="${sorted.length} task${sorted.length === 1 ? "" : "s"}">${sorted.length}</span>
                        </div>
                        <ul class="card-list" data-role="card-list">${cardsHtml}</ul>
                    </article>
                `;
            }

            function renderLoadingBoard() {
                const board = document.getElementById("board");
                board.innerHTML = STATUS.map((status) => `
                    <article class="column" data-status="${status}">
                        <div class="column-header">
                            <h2 class="column-title">${STATUS_LABELS[status]}</h2>
                            <span class="column-count" aria-label="0 tasks">0</span>
                        </div>
                        <ul class="card-list is-loading" data-role="card-list">
                            <li class="task-card" aria-hidden="true"></li>
                        </ul>
                    </article>
                `).join("");
            }

            function setBoardState(nextState, options = {}) {
                boardState = nextState;

                if (nextState === "loading") {
                    showBoardMessage("Loading tasks...");
                    renderLoadingBoard();
                    return;
                }

                if (nextState === "ready") {
                    clearBoardMessage();
                    renderBoard(tasks);
                    return;
                }

                if (nextState === "empty") {
                    showBoardMessage("No tasks yet. Add one to get started.");
                    renderBoard([]);
                    return;
                }

                if (nextState === "error") {
                    renderBoard([]);
                    showBoardMessage(options.message || "Could not load tasks.", {
                        isError: true,
                        showRetry: true
                    });
                }
            }

            function renderBoard(taskList) {
                const board = document.getElementById("board");
                const grouped = {
                    ToDo: [],
                    InProgress: [],
                    Done: []
                };

                taskList.forEach((task) => {
                    if (grouped[task.status]) {
                        grouped[task.status].push(task);
                    }
                });

                board.innerHTML = STATUS.map((status) => renderColumn(status, grouped[status])).join("");
            }

            function renderError(message) {
                const board = document.getElementById("board");
                const safeMessage = escapeHtml(message);

                board.innerHTML = STATUS.map((status) => {
                    const isTodo = status === "ToDo";
                    const errorCard = isTodo
                        ? `
                            <li class="task-card is-error">
                                <h3 class="task-title">Could not load tasks</h3>
                                <p class="task-description">${safeMessage}</p>
                            </li>
                        `
                        : "";

                    return `
                        <article class="column" data-status="${status}">
                            <div class="column-header">
                                <h2 class="column-title">${STATUS_LABELS[status]}</h2>
                                <span class="column-count" aria-label="0 tasks">0</span>
                            </div>
                            <ul class="card-list" data-role="card-list">${errorCard}</ul>
                        </article>
                    `;
                }).join("");
            }

            function buildTasksQuery() {
                const params = new URLSearchParams();
                const trimmedSearch = searchFilter.trim();
                const trimmedAssignee = assigneeFilter.trim();

                if (trimmedSearch) {
                    params.set("search", trimmedSearch);
                }
                if (priorityFilter) {
                    params.set("priority", priorityFilter);
                }
                if (trimmedAssignee) {
                    params.set("assignee", trimmedAssignee);
                }
                if (overdueFilter) {
                    params.set("overdue", overdueFilter);
                }

                const query = params.toString();
                return query ? `?${query}` : "";
            }

            async function fetchTasks() {
                setBoardState("loading");

                try {
                    const query = buildTasksQuery();
                    const response = await fetch(`${API_BASE}/tasks${query}`);
                    if (!response.ok) {
                        throw new Error(`Request failed with status ${response.status}`);
                    }

                    const data = await response.json();
                    const loadedTasks = Array.isArray(data) ? data : (Array.isArray(data.tasks) ? data.tasks : []);

                    tasks = loadedTasks;
                    if (tasks.length === 0) {
                        setBoardState("empty");
                    } else {
                        setBoardState("ready");
                    }
                } catch (error) {
                    const message = error instanceof Error ? error.message : "Unknown error";
                    setBoardState("error", { message });
                }
            }

            function extractErrorMessage(data, fallback) {
                if (!data) {
                    return fallback;
                }

                const detail = data.detail;
                if (typeof detail === "string") {
                    return detail;
                }

                if (Array.isArray(detail)) {
                    const messages = detail
                        .map((item) => (item && typeof item.msg === "string") ? item.msg : null)
                        .filter(Boolean);
                    if (messages.length) {
                        return messages.join("; ");
                    }
                }

                if (detail && typeof detail === "object") {
                    return JSON.stringify(detail);
                }

                return fallback;
            }

            function getTaskPayloadFromForm() {
                const refs = getModalRefs();
                const title = refs.fieldTitle.value.trim();
                const description = refs.fieldDescription.value;
                const dueDateRaw = refs.fieldDueDate.value;
                const assigneeRaw = refs.fieldAssignee.value.trim();

                return {
                    title,
                    description,
                    due_date: dueDateRaw === "" ? null : dueDateRaw,
                    status: refs.fieldStatus.value,
                    priority: refs.fieldPriority.value,
                    assignee: assigneeRaw === "" ? null : assigneeRaw
                };
            }

            async function submitTaskForm(event) {
                event.preventDefault();
                if (modalSubmitLocked) {
                    return;
                }

                const refs = getModalRefs();
                clearModalErrors();

                const payload = getTaskPayloadFromForm();
                if (payload.title === "") {
                    refs.errTitle.textContent = "Title is required";
                    refs.fieldTitle.focus();
                    return;
                }

                const taskId = refs.fieldId.value;
                const isEditMode = modalMode === "edit";
                const url = isEditMode
                    ? `${API_BASE}/tasks/${encodeURIComponent(taskId)}`
                    : `${API_BASE}/tasks`;
                const method = isEditMode ? "PATCH" : "POST";

                if (isEditMode && payload.status === editingTaskStatus) {
                    delete payload.status;
                }

                modalSubmitLocked = true;
                refs.submit.disabled = true;

                try {
                    const response = await fetch(url, {
                        method,
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        closeTaskModal();
                        clearBoardMessage();
                        fetchTasks();
                        return;
                    }

                    let errorData = null;
                    try {
                        errorData = await response.json();
                    } catch (parseError) {
                        errorData = null;
                    }

                    if (response.status === 422) {
                        const mapped = mapServerErrorsToModal(errorData);
                        if (!mapped) {
                            showModalBanner(extractErrorMessage(errorData, "Validation failed"));
                        }
                    } else {
                        showModalBanner(extractErrorMessage(errorData, `Request failed with status ${response.status}`));
                    }
                } catch (error) {
                    showModalBanner("Network error: could not save task. Please try again.");
                } finally {
                    modalSubmitLocked = false;
                    refs.submit.disabled = false;
                }
            }

            function initFilterToolbar() {
                const searchInput = document.getElementById("filter-search");
                const prioritySelect = document.getElementById("filter-priority");
                const assigneeInput = document.getElementById("filter-assignee");
                const overdueSelect = document.getElementById("overdue-filter");
                const clearButton = document.getElementById("clear-filters-btn");

                searchInput.addEventListener("input", () => {
                    searchFilter = searchInput.value;
                    if (searchDebounceTimer) {
                        clearTimeout(searchDebounceTimer);
                    }
                    searchDebounceTimer = setTimeout(fetchTasks, 300);
                });

                prioritySelect.addEventListener("change", () => {
                    priorityFilter = prioritySelect.value;
                    fetchTasks();
                });

                assigneeInput.addEventListener("change", () => {
                    assigneeFilter = assigneeInput.value;
                    fetchTasks();
                });

                overdueSelect.addEventListener("change", () => {
                    overdueFilter = overdueSelect.value;
                    fetchTasks();
                });

                clearButton.addEventListener("click", () => {
                    searchFilter = "";
                    priorityFilter = "";
                    assigneeFilter = "";
                    overdueFilter = "";
                    searchInput.value = "";
                    prioritySelect.value = "";
                    assigneeInput.value = "";
                    overdueSelect.value = "";
                    fetchTasks();
                });
            }

            function initTaskModal() {
                const refs = getModalRefs();
                const board = document.getElementById("board");
                const newTaskButton = document.getElementById("new-task-btn");

                newTaskButton.addEventListener("click", () => {
                    openTaskModal("create");
                });

                refs.close.addEventListener("click", () => {
                    closeTaskModal();
                });

                refs.cancel.addEventListener("click", () => {
                    closeTaskModal();
                });

                refs.modal.addEventListener("click", (event) => {
                    if (event.target === refs.modal) {
                        closeTaskModal();
                    }
                });

                document.addEventListener("keydown", (event) => {
                    if (event.key === "Escape" && refs.modal.classList.contains("is-open")) {
                        closeTaskModal();
                    }
                });

                refs.form.addEventListener("submit", submitTaskForm);

                board.addEventListener("click", (event) => {
                    const editButton = event.target.closest(".edit-btn");
                    if (!editButton) {
                        return;
                    }

                    const card = editButton.closest(".task-card[data-task-id]");
                    if (!card) {
                        return;
                    }

                    const task = tasks.find((candidate) => String(candidate.id) === String(card.dataset.taskId));
                    if (!task) {
                        showBoardMessage("Task details are unavailable. Please refresh and try again.", { isError: true });
                        return;
                    }

                    openTaskModal("edit", task);
                });
            }

            function clearDragOverStyles() {
                document.querySelectorAll(".column.drag-over, .column.drag-forbidden").forEach((column) => {
                    column.classList.remove("drag-over", "drag-forbidden");
                });
            }

            async function handleCardDrop(taskId, targetStatus) {
                const task = tasks.find((candidate) => String(candidate.id) === String(taskId));
                if (!task) {
                    return;
                }

                const previousStatus = task.status;
                if (previousStatus === targetStatus) {
                    return;
                }

                if (!isValidTransition(previousStatus, targetStatus)) {
                    showBoardMessage(
                        `Tasks cannot move from ${STATUS_LABELS[previousStatus]} to ${STATUS_LABELS[targetStatus]}.`,
                        { isError: true }
                    );
                    return;
                }

                task.status = targetStatus;
                renderBoard(tasks);

                try {
                    const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ status: targetStatus })
                    });

                    if (response.ok) {
                        return;
                    }

                    let errorData = null;
                    try {
                        errorData = await response.json();
                    } catch (parseError) {
                        errorData = null;
                    }

                    task.status = previousStatus;
                    renderBoard(tasks);
                    showBoardMessage(
                        extractErrorMessage(errorData, `Request failed with status ${response.status}`),
                        { isError: true }
                    );
                } catch (networkError) {
                    task.status = previousStatus;
                    renderBoard(tasks);
                    showBoardMessage(
                        "Network error: could not update task status. Please check your connection and try again.",
                        { isError: true }
                    );
                }
            }

            function initDragAndDrop() {
                const board = document.getElementById("board");

                board.addEventListener("dragstart", (event) => {
                    const card = event.target.closest(".task-card[draggable=\"true\"]");
                    if (!card || !card.dataset.taskId) {
                        return;
                    }

                    const task = tasks.find((candidate) => String(candidate.id) === String(card.dataset.taskId));
                    draggingStatus = task ? task.status : null;

                    event.dataTransfer.effectAllowed = "move";
                    event.dataTransfer.setData("text/plain", card.dataset.taskId);
                    card.classList.add("is-dragging");
                });

                board.addEventListener("dragend", (event) => {
                    const card = event.target.closest(".task-card");
                    if (card) {
                        card.classList.remove("is-dragging");
                    }
                    draggingStatus = null;
                    clearDragOverStyles();
                });

                board.addEventListener("dragover", (event) => {
                    const column = event.target.closest(".column");
                    if (!column) {
                        return;
                    }

                    const targetStatus = column.dataset.status;
                    if (!isValidTransition(draggingStatus, targetStatus)) {
                        clearDragOverStyles();
                        if (!column.classList.contains("drag-forbidden")) {
                            column.classList.add("drag-forbidden");
                        }
                        event.dataTransfer.dropEffect = "none";
                        return;
                    }

                    event.preventDefault();
                    event.dataTransfer.dropEffect = "move";

                    if (!column.classList.contains("drag-over")) {
                        clearDragOverStyles();
                        column.classList.add("drag-over");
                    }
                });

                board.addEventListener("dragleave", (event) => {
                    const column = event.target.closest(".column");
                    if (!column) {
                        return;
                    }

                    if (!column.contains(event.relatedTarget)) {
                        column.classList.remove("drag-over", "drag-forbidden");
                    }
                });

                board.addEventListener("drop", (event) => {
                    const column = event.target.closest(".column");
                    if (!column) {
                        return;
                    }

                    event.preventDefault();
                    clearDragOverStyles();

                    const taskId = event.dataTransfer.getData("text/plain");
                    const targetStatus = column.dataset.status;
                    if (!taskId || !targetStatus) {
                        return;
                    }

                    handleCardDrop(taskId, targetStatus);
                });
            }

            initDragAndDrop();
            initTaskModal();
            initFilterToolbar();
            fetchTasks();
        </script>
    </body>
</html>
